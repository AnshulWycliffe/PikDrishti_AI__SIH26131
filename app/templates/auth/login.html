{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-language-row">
        <button class="btn btn-sm btn-outline-success rounded-pill px-3 fw-semibold bg-white shadow-sm" data-bs-toggle="modal" data-bs-target="#globalLangModal">
            <i class="bi bi-translate me-1"></i><span class="top-lang-label">English</span>
        </button>
    </div>
    <div class="card auth-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='images/icons/icon-192.png') }}" class="auth-brand-mark" alt="PikDrishti AI">
            <h2 class="fw-bold auth-title mb-1">Welcome Back</h2>
            <p class="auth-subtitle small">Sign in to access your farm dashboard</p>
        </div>
        
        <form method="POST" action="">
            <div class="mb-3">
                <label class="auth-field-label">Email Address or Phone Number</label>
                <div class="input-group auth-input-group">
                    <span class="input-group-text border-end-0"><i class="bi bi-person-badge"></i></span>
                    <input type="text" name="login_id" class="form-control border-start-0 ps-0" required placeholder="Email or Phone">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="auth-field-label">Password</label>
                <div class="input-group auth-input-group">
                    <span class="input-group-text border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" required placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn auth-submit text-white w-100 btn-lg rounded-pill mb-3">Log In</button>
        </form>
        
        <div class="text-center mt-3">
            <span class="text-muted small">Don't have an account? </span>
            <a href="{{ url_for('auth.register') }}" class="auth-footer-link text-decoration-none small">Register</a>
        </div>
    </div>
</div>
{% endblock %}
